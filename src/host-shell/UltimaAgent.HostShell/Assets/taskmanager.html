<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultima Agent 运行任务</title>
<style>
  @font-face { font-family: "HarmonyOS Sans"; src: url("HarmonyOS_Sans.ttf"); }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC.ttf"); }
  :root {
    color-scheme: dark;
    font-family: "HarmonyOS Sans SC", "HarmonyOS Sans", sans-serif;
    background: #0F1420;
    color: #E8EDF5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-width: 100%; min-height: 100%; background: #0F1420; }
  body { padding: 32px; }
  button { font: inherit; }
  button:focus-visible { outline: 2px solid #7F9CFF; outline-offset: 3px; }
  ::selection { color: #05060C; background: #7F9CFF; }
  .panel { max-width: 1080px; margin: 0 auto; }
  .heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
  h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; }
  .summary, .updated { margin: 0; color: #AAB8D0; font-size: 14px; line-height: 1.5; }
  .updated { font-variant-numeric: tabular-nums; text-align: right; }
  .table { border-top: 1px solid rgba(127,156,255,.28); }
  .row { display: grid; grid-template-columns: minmax(180px,1.5fr) 110px 92px 92px 110px minmax(150px,1fr) 96px;
         gap: 14px; align-items: center; min-height: 78px; padding: 14px 4px;
         border-bottom: 1px solid rgba(127,156,255,.16); }
  .head { min-height: 44px; color: #AAB8D0; font-size: 12px; letter-spacing: .02em; }
  .task-name { min-width: 0; }
  .task-name strong { display: block; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-name span { display: block; margin-top: 5px; color: #AAB8D0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #AAB8D0; }
  .status[data-status="running"]::before { background: #7F9CFF; }
  .status[data-status="cooldown"]::before { background: #FFA94D; }
  .status[data-status="error"]::before { background: #FF5A5A; }
  .status[data-status="disabled"]::before { background: #6E7890; }
  .number, .probe { color: #D7DEEC; font-size: 13px; font-variant-numeric: tabular-nums; }
  .probe { line-height: 1.4; }
  .switch { width: 52px; min-height: 32px; padding: 4px; border: 1px solid rgba(127,156,255,.35);
            border-radius: 999px; background: #182033; cursor: pointer; transition: background .18s ease-out; }
  .switch::after { content: ""; display: block; width: 22px; height: 22px; border-radius: 50%;
                   background: #AAB8D0; transition: transform .18s ease-out, background .18s ease-out; }
  .switch[aria-checked="true"] { background: #263B70; }
  .switch[aria-checked="true"]::after { transform: translateX(18px); background: #E8EDF5; }
  .restart { min-height: 44px; padding: 0 16px; border: 1px solid rgba(127,156,255,.45); border-radius: 12px;
             color: #E8EDF5; background: #182033; cursor: pointer; transition: background .18s ease-out; }
  .restart:hover { background: #26314A; }
  .restart:disabled, .switch:disabled { cursor: wait; opacity: .55; }
  .placeholder { padding: 72px 20px; text-align: center; color: #AAB8D0; line-height: 1.6; }
  .feedback { min-height: 24px; margin-top: 16px; color: #AAB8D0; font-size: 13px; }
  .feedback.error { color: #FF8787; }
  @media (max-width: 820px) {
    body { padding: 18px; }
    .row { grid-template-columns: minmax(126px,1fr) 54px 72px 48px 58px 82px 68px; gap: 6px; }
    .head { font-size: 11px; }
    .restart { padding: 0 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::after, .restart { transition: none; }
  }
</style>
</head>
<body>
<main class="panel">
  <header class="heading">
    <div>
      <h1>运行任务</h1>
      <p class="summary" id="summary">正在连接 HostShell…</p>
    </div>
    <p class="updated" id="updated">等待首个快照</p>
  </header>
  <section class="table" aria-label="HostShell 托管任务">
    <div class="row head" aria-hidden="true">
      <span>任务</span><span>启用</span><span>状态</span><span>PID</span><span>重启次数</span><span>最近探活</span><span>操作</span>
    </div>
    <div id="rows"><p class="placeholder">任务状态尚未送达。</p></div>
  </section>
  <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
</main>
<script>
(function () {
  'use strict';
  const rows = document.getElementById('rows');
  const summary = document.getElementById('summary');
  const updated = document.getElementById('updated');
  const feedback = document.getElementById('feedback');
  let latest = null;

  function post(message) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(message);
    }
  }

  function formatTime(value) {
    if (!value) return '尚无记录';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '时间不可读' : date.toLocaleTimeString('zh-CN', { hour12: false });
  }

  function setFeedback(message, isError) {
    feedback.textContent = message || '';
    feedback.classList.toggle('error', Boolean(isError));
  }

  function actionButton(task, action, label) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = action === 'restart' ? 'restart' : 'switch';
    button.dataset.action = action;
    button.dataset.taskId = task.task_id;
    if (action === 'set-enabled') {
      button.setAttribute('role', 'switch');
      button.setAttribute('aria-checked', String(Boolean(task.enabled)));
      button.setAttribute('aria-label', `${task.enabled ? '停用' : '启用'} ${task.name}`);
    } else {
      button.textContent = label;
      button.setAttribute('aria-label', `重启 ${task.name}`);
    }
    button.addEventListener('click', function () {
      button.disabled = true;
      setFeedback(`${task.name}：正在执行${action === 'restart' ? '重启' : (task.enabled ? '停用' : '启用')}…`, false);
      post(action === 'restart'
        ? { kind: 'restart', task_id: task.task_id }
        : { kind: 'set-enabled', task_id: task.task_id, enabled: !task.enabled });
    });
    return button;
  }

  function render(snapshot) {
    latest = snapshot;
    rows.replaceChildren();
    const tasks = Array.isArray(snapshot.tasks) ? snapshot.tasks : [];
    summary.textContent = tasks.length ? `${tasks.length} 个托管任务` : '当前没有托管任务';
    updated.textContent = `快照 ${formatTime(snapshot.generated_at)}`;
    if (!tasks.length) {
      const empty = document.createElement('p');
      empty.className = 'placeholder';
      empty.textContent = '注册表为空。HostShell 启动任务后会在这里显示。';
      rows.appendChild(empty);
      return;
    }
    for (const task of tasks) {
      const row = document.createElement('article');
      row.className = 'row';
      row.dataset.taskId = task.task_id;

      const identity = document.createElement('div');
      identity.className = 'task-name';
      const name = document.createElement('strong');
      name.textContent = task.name || task.task_id;
      const detail = document.createElement('span');
      detail.textContent = task.last_result || task.task_id;
      identity.append(name, detail);

      const enabled = actionButton(task, 'set-enabled', '');
      const status = document.createElement('span');
      status.className = 'status';
      status.dataset.status = task.status || 'stopped';
      status.textContent = task.status || 'stopped';
      const pid = document.createElement('span');
      pid.className = 'number';
      pid.textContent = task.pid == null ? '—' : String(task.pid);
      const restarts = document.createElement('span');
      restarts.className = 'number';
      restarts.textContent = String(task.restart_count || 0);
      const probe = document.createElement('span');
      probe.className = 'probe';
      probe.textContent = formatTime(task.last_probe_at);
      const restart = actionButton(task, 'restart', '重启');
      restart.disabled = !task.enabled;
      row.append(identity, enabled, status, pid, restarts, probe, restart);
      rows.appendChild(row);
    }
  }

  window.__ultimaTaskManagerTestClick = function (action, taskId, enabled) {
    const selector = `[data-action="${action}"][data-task-id="${taskId}"]`;
    const button = document.querySelector(selector);
    if (!button || button.disabled) return false;
    if (action === 'set-enabled' && enabled !== null) {
      const current = button.getAttribute('aria-checked') === 'true';
      if (current === Boolean(enabled)) return true;
    }
    button.click();
    return true;
  };

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', function (event) {
      const message = event.data;
      if (message && message.kind === 'ultima.taskmanager.error') {
        rows.innerHTML = '<p class="placeholder">任务状态暂时不可读，HostShell 将自动重试。</p>';
        setFeedback(message.message, true);
        return;
      }
      if (message && message.kind === 'ultima.taskmanager.action-result') {
        setFeedback(message.ok ? '操作已生效，状态已刷新。' : (message.message || '操作失败，请重试。'), !message.ok);
        return;
      }
      if (message && message.schema === 'ultimaagent-host-task-state/v1') {
        setFeedback('', false);
        render(message);
      }
    });
    post({ kind: 'ultima.taskmanager.ready' });
  } else {
    rows.innerHTML = '<p class="placeholder">未连接到 HostShell，无法读取任务状态。</p>';
    setFeedback('WebView 消息桥不可用。', true);
  }
})();
</script>
</body>
</html>
